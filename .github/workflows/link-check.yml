name: External link check

on:
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external links
        id: check
        run: |
          set +e
          node scripts/check-links.mjs > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="外部リンク監視: 要対応"
          number=$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file report.md; else gh issue create --title "$title" --body-file report.md; fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "$(date -u +%F) の確認で要対応のリンクはなくなりました。" && gh issue close "$number"
          fi
